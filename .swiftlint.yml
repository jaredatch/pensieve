disabled_rules:
  # `let _ = observableProperty` inside a SwiftUI @ViewBuilder `body` is a deliberate
  # dependency-tracking idiom — dropping the `let` makes it a bare `()` expression that
  # fails View conformance ("type '()' cannot conform to 'View'"). The rule is a false
  # positive in ViewBuilders, so it is disabled project-wide.
  - redundant_discardable_let

included:
  - Pensieve
  - PensieveTests

excluded:
  - DerivedData
  - build
  - .build
  - Pensieve.xcodeproj

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 40

line_length:
  warning: 130
  error: 130

function_parameter_count:
  # Skill creation carries the six user-entered fields through one UI boundary.
  warning: 6
  error: 6

custom_rules:
  short_test_timeout:
    included: 'PensieveTests/.*\.swift$'
    name: "Shared positive wait bound"
    # Match arguments and typed defaults, including DispatchTime offsets. Milliseconds below
    # 15000 and seconds below 15 require the shared bound or an intentional-limit explanation.
    regex: '(?-s)\btimeout:\s*(?:[A-Za-z_][A-Za-z0-9_.<>?]*\s*=\s*)?(?:\.seconds\(\s*(?:0_?)*(?:[0-9]|1_?[0-4])(?:\.[0-9](?:_?[0-9])*)?\s*\)|\.milliseconds\(\s*(?:0_?)*(?:[0-9](?:_?[0-9]){0,3}|1_?[0-4](?:_?[0-9]){3})(?:\.[0-9](?:_?[0-9])*)?\s*\)|(?:\.now\(\)\s*\+\s*)?(?:0_?)*(?:[0-9]|1_?[0-4])(?:\.[0-9](?:_?[0-9])*)?(?=\s*(?:[,)]|//|/\*)))(?![^\n]*//\s*upper-bound:)'
    message: "Use TestWait.hostedActionTimeoutSeconds, or explain the intentional limit with // upper-bound: on this line."
    severity: error
