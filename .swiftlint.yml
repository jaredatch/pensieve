disabled_rules:
  # `let _ = observableProperty` inside a SwiftUI @ViewBuilder `body` is a deliberate
  # dependency-tracking idiom — dropping the `let` makes it a bare `()` expression that
  # fails View conformance ("type '()' cannot conform to 'View'"). The rule is a false
  # positive in ViewBuilders, so it is disabled project-wide.
  - redundant_discardable_let

included:
  - Pensieve
  - PensieveTests

excluded:
  - DerivedData
  - build
  - .build
  - Pensieve.xcodeproj

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 40

line_length:
  warning: 130
  error: 130

function_parameter_count:
  # Skill creation carries the six user-entered fields through one UI boundary.
  warning: 6
  error: 6

custom_rules:
  short_positive_poll_wait:
    included: 'PensieveTests/.*\.swift$'
    name: "Shared positive wait bound"
    regex: '(?-s)\bTestWait\.until\(\s*timeout:\s*\.seconds\(\s*(?:[0-9]|1[0-4])(?:\.[0-9]+)?\s*\)(?![^\n]*//\s*upper-bound:)'
    message: "Use TestWait.hostedActionTimeoutSeconds, or explain the intentional limit with // upper-bound: on this line."
    severity: error
  short_positive_expectation_wait:
    included: 'PensieveTests/.*\.swift$'
    name: "Shared expectation wait bound"
    regex: '(?-s)\b(?:fulfillment|wait)\(\s*(?:of|for):[^)]*?timeout:\s*(?:[0-9]|1[0-4])(?:\.[0-9]+)?\s*[,)](?![^\n]*//\s*upper-bound:)'
    message: "Use TestWait.hostedActionTimeoutSeconds, or explain an upper bound or inverted observation with // upper-bound:."
    severity: error
