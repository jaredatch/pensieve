name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 134 # 124 minutes of step bounds plus 10 minutes of headroom.
    env:
      CI_LARGEST_PUSH: 200 # Covers plan merges; larger pushes must resize the measured bounds.
    # Worst times: Actions runs 37074075055 and 37063706683, with local additions scaled by 2x below.
    steps:
      - name: Checkout
        timeout-minutes: 2 # Worst measured: 2 s; bound >= 3x.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        timeout-minutes: 5 # Worst measured: 3 s; bound >= 3x.
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcodegen generate

      - name: Compute replay range
        timeout-minutes: 1 # Worst measured: 0 s; bound >= 3x.
        id: replay-range
        run: |
          set -euo pipefail
          echo "skip_default_merge_head=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; skipping per-commit replay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          zeros="0000000000000000000000000000000000000000"
          if [ -z "$before" ] || [ "$before" = "$zeros" ]; then
            git fetch origin master:refs/remotes/origin/master
            range="origin/master..${{ github.sha }}"
          else
            range="$before..${{ github.sha }}"
          fi

          if ! count="$(git rev-list --count "$range" 2>/tmp/ci-replay-range.err)"; then
            echo "::error::Invalid replay range: $range"
            cat /tmp/ci-replay-range.err
            exit 1
          fi
          if [ "$count" -gt "$CI_LARGEST_PUSH" ]; then
            echo "::error::Push of $count commits exceeds limit $CI_LARGEST_PUSH; resize the measured CI bounds before replay."
            exit 1
          fi
          if [ "$count" = "0" ]; then
            echo "No commits in $range; skipping per-commit replay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Replaying $count commit(s) in $range."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "range=$range" >> "$GITHUB_OUTPUT"
          fi

      - name: Test public hygiene guard
        timeout-minutes: 8 # Worst estimate: 158 s = 156 s runner + ceil(2 x 0.731 s local added checks); bound >= 3x.
        run: ./script/public-hygiene.sh --self-test

      - name: Test workflow contracts
        timeout-minutes: 1 # Worst estimate: 15 s = max(3 s runner, ceil(2 x 7.273 s local full suite)); bound >= 3x.
        run: ruby script/workflow_self_test.rb

      - name: Test release recovery
        timeout-minutes: 21 # Worst estimate: 409 s = ceil(2 x 204.182 s local recovery); absent from API runs; bound >= 3x.
        run: python3 -B script/release_self_test.py

      - name: Test development build host selection
        timeout-minutes: 1 # Worst measured: 0 s; bound >= 3x.
        run: python3 -B script/pull_dev_build_self_test.py

      - name: Check public hygiene in pushed commits
        timeout-minutes: 13 # Run 37063706683 (1 commit): 22 s fixed + run 37218019371: 20 s / 17 commits x CI_LARGEST_PUSH; bound >= 3x.
        if: steps.replay-range.outputs.skip != 'true'
        env:
          HYGIENE_RANGE: ${{ steps.replay-range.outputs.range }}
        run: ./script/public-hygiene.sh --range "$HYGIENE_RANGE"

      - name: Replay commit guards
        timeout-minutes: 19 # Run 37063706683 (1 commit): 35 s fixed + run 37218019371: 28 s / 17 commits x CI_LARGEST_PUSH; bound >= 3x.
        if: steps.replay-range.outputs.skip != 'true'
        run: |
          RATCHET_CI_SKIP_DEFAULT_MERGE_HEAD="${{ steps.replay-range.outputs.skip_default_merge_head }}" \
            ./script/ci-replay.sh "${{ steps.replay-range.outputs.range }}"

      - name: Test
        timeout-minutes: 45 # Worst estimate: 887 s = 867 s runner + ceil(2 x 9.826 s local wrapper self-test); bound >= 3x.
        id: tests
        run: |
          set -o pipefail
          ./script/test.sh --self-test
          ./script/test.sh | tee /tmp/ci-test.out
          count="$(grep -oE 'PENSIEVE_TEST_COUNT=[0-9]+' /tmp/ci-test.out | tail -1 | cut -d= -f2)"
          floor="$(cat .test-count)"
          if [ -z "$count" ] || [ "$count" -lt "$floor" ]; then
            echo "::error::test count ${count:-none} below committed floor $floor"
            exit 1
          fi

      - name: Upload failed test evidence
        timeout-minutes: 5 # Worst measured: 7 s; bound >= 3x.
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-test-evidence
          path: |
            DerivedData/FailedRuns/
            DerivedData/TestRuns/
            DerivedData/TestDiagnostics/
          if-no-files-found: warn

      - name: Headless smoke
        timeout-minutes: 1 # Worst measured: 14 s; bound >= 3x.
        run: |
          ./script/build_and_run.sh --headless
