name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 128 # Step minutes + 10 headroom.
    env:
      CI_LARGEST_PUSH: 200 # Covers plan merges; larger pushes must resize the measured bounds.
    # Worst times: Actions runs 37074075055 and 37063706683, with local additions scaled by 2x below.
    steps:
      - name: Checkout
        timeout-minutes: 2 # Worst measured: 2 s; bound >= 3x.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        timeout-minutes: 5 # Worst measured: 3 s; bound >= 3x.
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          ./script/generate.sh

      - name: Compute replay range
        timeout-minutes: 1 # Worst measured: 0 s; bound >= 3x.
        id: replay-range
        run: |
          set -euo pipefail
          echo "skip_default_merge_head=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; skipping per-commit replay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          zeros="0000000000000000000000000000000000000000"
          if [ -z "$before" ] || [ "$before" = "$zeros" ]; then
            git fetch origin master:refs/remotes/origin/master
            range="origin/master..${{ github.sha }}"
          else
            range="$before..${{ github.sha }}"
          fi

          if ! count="$(git rev-list --count "$range" 2>/tmp/ci-replay-range.err)"; then
            echo "::error::Invalid replay range: $range"
            cat /tmp/ci-replay-range.err
            exit 1
          fi
          if [ "$count" -gt "$CI_LARGEST_PUSH" ]; then
            echo "::error::Push of $count commits exceeds limit $CI_LARGEST_PUSH; resize the measured CI bounds before replay."
            exit 1
          fi
          if [ "$count" = "0" ]; then
            echo "No commits in $range; skipping per-commit replay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Replaying $count commit(s) in $range."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "range=$range" >> "$GITHUB_OUTPUT"
          fi

      - name: Test public hygiene guard
        timeout-minutes: 8 # Worst estimate: 158 s = 156 s runner + ceil(2 x 0.731 s local added checks); bound >= 3x.
        run: ./script/public-hygiene.sh --self-test

      - name: Test workflow contracts
        # Worst of three serial samples, rounded up to milliseconds, 2026-10-05;
        # Mac16,11 / Apple M4 Pro, macOS 26.6.2 (25G83): 8.951 s.
        timeout-minutes: 1 # Estimate 18 s = max(3 s runner, ceil(2 x 8.951)); bound >= 3x.
        run: ruby script/workflow_self_test.rb

      - name: Test development build host selection
        timeout-minutes: 1 # Worst measured: 0 s; bound >= 3x.
        run: python3 -B script/pull_dev_build_self_test.py

      - name: Check public hygiene in pushed commits
        timeout-minutes: 13 # Run 37063706683 (1 commit): 22 s fixed + run 37218019371: 20 s / 17 commits x CI_LARGEST_PUSH; bound >= 3x.
        if: steps.replay-range.outputs.skip != 'true'
        env:
          HYGIENE_RANGE: ${{ steps.replay-range.outputs.range }}
        run: ./script/public-hygiene.sh --range "$HYGIENE_RANGE"

      - name: Test wrapper
        timeout-minutes: 5 # Three serial local samples: 45.347/44.299/47.171 s; ceil(2x worst) = 95 s; bound >= 3x.
        run: ./script/test.sh --self-test

      - name: Test
        timeout-minutes: 71 # Estimate 1408 s = ceil((3515 - 354) / 3 + 354); bound >= 3x.
        id: tests
        run: ./script/test.sh --shard 1/3

      - name: Test CLI contract
        timeout-minutes: 3 # Three serial local samples: 28.872/28.594/28.480 s; 2x runner and 3x margin.
        run: python3 -B script/cli_contract_test.py --binary DerivedData/Build/Products/Debug/Pensieve.app/Contents/Helpers/pensieve

      - name: Upload failed test evidence
        timeout-minutes: 5 # Worst measured: 7 s; bound >= 3x.
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-test-evidence-1
          path: |
            DerivedData/FailedRuns/
            DerivedData/TestRuns/
            DerivedData/TestDiagnostics/
          if-no-files-found: warn

      - name: Headless smoke
        timeout-minutes: 1 # Worst measured: 14 s; bound >= 3x.
        run: |
          ./script/build_and_run.sh --headless

  test-shard-2:
    name: Test shard 2
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 95 # Step minutes + 10 headroom.
    steps:
      - name: Checkout
        timeout-minutes: 2 # Worst measured: 2 s; bound >= 3x.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        timeout-minutes: 5 # Worst measured: 3 s; bound >= 3x.
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          ./script/generate.sh

      - name: Test
        timeout-minutes: 71 # Estimate 1408 s = ceil((3515 - 354) / 3 + 354); bound >= 3x.
        id: tests
        run: ./script/test.sh --shard 2/3

      - name: Upload failed test evidence
        timeout-minutes: 5 # Worst measured: 7 s; bound >= 3x.
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-test-evidence-2
          path: |
            DerivedData/FailedRuns/
            DerivedData/TestRuns/
            DerivedData/TestDiagnostics/
          if-no-files-found: warn

  test-shard-3:
    name: Test shard 3
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 95 # Step minutes + 10 headroom.
    steps:
      - name: Checkout
        timeout-minutes: 2 # Worst measured: 2 s; bound >= 3x.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        timeout-minutes: 5 # Worst measured: 3 s; bound >= 3x.
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          ./script/generate.sh

      - name: Test
        timeout-minutes: 71 # Estimate 1408 s = ceil((3515 - 354) / 3 + 354); bound >= 3x.
        id: tests
        run: ./script/test.sh --shard 3/3

      - name: Upload failed test evidence
        timeout-minutes: 5 # Worst measured: 7 s; bound >= 3x.
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-test-evidence-3
          path: |
            DerivedData/FailedRuns/
            DerivedData/TestRuns/
            DerivedData/TestDiagnostics/
          if-no-files-found: warn

  release-recovery:
    name: Release recovery
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 83 # Step minutes + 10 headroom.
    steps:
      - name: Checkout
        timeout-minutes: 2 # Worst measured: 2 s; bound >= 3x.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        timeout-minutes: 1 # Worst measured: 1 s; bound >= 3x.
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version

      - name: Test release recovery
        # Full suite including CLI release checks, 2026-10-13: 696.103 s local.
        timeout-minutes: 70 # Estimate 1393 s = ceil(2 x 696.103); bound >= 3x.
        run: python3 -B script/release_self_test.py
