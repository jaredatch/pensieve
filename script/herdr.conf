XP_CHECKPOINT_CMD="/checkpoint"
XP_RESUME_CMD="/clear-continue automatic"
XP_RESUME_NOTE="tmp/clear-continue.md"
XP_WORKTREE_SETUP="xcodegen generate && python3 -B private/release/public-repo/cutover/trees.py --link-commands ."
XP_PLANNER_WINDOW=1000000
XP_PLANNER_ARGS="--dangerously-skip-permissions"
XP_SPRINT_START_CMD="/sprint-start [new-stream — automated, not the human]"
XP_WATCH_CMD='t=$(gh auth token --user kramer-bot) || exit 1; n=$(GH_TOKEN="$t" gh issue list -R jaredatch/pensieve --assignee kramer-bot --json number --jq length) || exit 1; case "$n" in ""|*[!0-9]*) exit 1 ;; esac; [ "$n" = 0 ] || echo "ASSIGNED: $n issue(s) to kramer-bot"'
